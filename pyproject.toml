[project]
name = "llm-twin"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dmitry Pavlyukevich", email = "dimonpd@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "chromedriver-autoinstaller>=0.6.4",
    "click>=8.2.1",
    "datasets>=5.0.1",
    "fake-useragent>=2.2.0",
    "fastapi>=0.138.2",
    "html2text>=2025.4.15",
    "jinja2>=3.1.6",
    "jmespath>=1.1.0",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.4.2",
    "loguru>=0.7.3",
    "numpy>=2.5.1",
    "opik>=2.2.23",
    "polars>=1.43.2",
    "pymongo>=4.17.0",
    "qdrant-client>=1.19.0",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "selenium>=4.46.0",
    "sentence-transformers>=5.7.0",
    "tiktoken>=0.13.0",
    "torch>=2.13.0",
    "uvicorn>=0.52.1",
    "webdriver-manager>=4.1.2",
    "zenml[local,server]>=0.96.3",
]

[project.scripts]
llm-twin = "llm_twin:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
